<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <title>Silent Dual Hourglass</title>
  <style>
    :root {
      --bg: #000;
      --card: #111;
      --card2: #171717;
      --text: #f5f5f5;
      --muted: #9a9a9a;
      --border: rgba(255,255,255,0.12);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    body {
      touch-action: manipulation;
      user-select: none;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    /* ---------- setup ---------- */
    .setup-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding:
        calc(14px + var(--safe-top))
        calc(14px + var(--safe-right))
        calc(14px + var(--safe-bottom))
        calc(14px + var(--safe-left));
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.05), transparent 30%),
        #000;
      overflow: auto;
    }

    .topbar {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 28px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .master-toggle {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      font-size: 14px;
    }

    .master-toggle label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .setup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      flex: 1;
      min-height: 0;
      align-items: stretch;
    }

    .setup-grid.single {
      grid-template-columns: 1fr;
    }

    .setup-card {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
      border-radius: 22px;
      background: linear-gradient(180deg, var(--card2), var(--card));
      border: 1px solid var(--border);
    }

    .card-title {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row.equal-2 > .field {
      flex: 1 1 0;
      min-width: 0;
    }

    .row.equal-3 > .field {
      flex: 1 1 0;
      min-width: 0;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
    }

    input[type="number"],
    input[type="date"],
    input[type="time"],
    select {
      width: 100%;
      height: 46px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.16);
      background: #000;
      color: #fff;
      font-size: 16px;
      padding: 0 12px;
      outline: none;
    }

    input[type="color"] {
      width: 100%;
      height: 46px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.16);
      background: #000;
      padding: 4px;
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .section-title {
      font-size: 13px;
      color: #d5d5d5;
      font-weight: 700;
    }

    .hidden {
      display: none !important;
    }

    .hint {
      min-height: 16px;
      font-size: 12px;
      color: #ffb6c9;
    }

    .start-btn {
      min-height: 54px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(180deg, #ffffff, #dddddd);
      color: #000;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    /* ---------- timer ---------- */
    .timer-screen {
      position: absolute;
      inset: 0;
      display: none;
      background: #000;
    }

    .timer-screen.active {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .timer-screen.single {
      grid-template-columns: 1fr;
    }

    .pane {
      position: relative;
      overflow: hidden;
      background: #000;
    }

    .pane + .pane {
      border-left: 1px solid rgba(255,255,255,0.08);
    }

    .base {
      position: absolute;
      inset: 0;
      background: #000;
    }

    .fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 0%;
      background: #ff69b4;
      will-change: height, opacity;
    }

    .blink .fill {
      animation: fillBlink 1s steps(2, start) infinite;
    }

    @keyframes fillBlink {
      0% { opacity: 1; }
      50% { opacity: 0.25; }
      100% { opacity: 1; }
    }

    .tap-layer {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: none;
      background: transparent;
    }

    .tap-layer.active {
      display: block;
    }

    .tap-pill {
      position: absolute;
      left: 50%;
      bottom: calc(20px + var(--safe-bottom));
      transform: translateX(-50%);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      background: rgba(0,0,0,0.48);
      backdrop-filter: blur(6px);
      white-space: nowrap;
    }

    .inline-setup {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: none;
      flex-direction: column;
      gap: 12px;
      padding:
        calc(14px + var(--safe-top))
        12px
        calc(14px + var(--safe-bottom))
        12px;
      background: linear-gradient(180deg, #131313, #050505);
      overflow: auto;
    }

    .inline-setup.active {
      display: flex;
    }

    .inline-title {
      margin: 0;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
    }

    .small-note {
      margin-top: -4px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    .restart-btn {
      min-height: 50px;
      border: none;
      border-radius: 16px;
      background: #fff;
      color: #000;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- ================= SETUP ================= -->
    <section id="setupScreen" class="setup-screen">
      <div class="topbar">無音砂時計</div>

      <div class="master-toggle">
        <label>
          <input id="rightEnabled" type="checkbox" checked />
          右側も使う
        </label>
      </div>

      <div id="setupGrid" class="setup-grid">
        <!-- LEFT -->
        <div class="setup-card">
          <h2 class="card-title">左</h2>

          <div class="section">
            <div class="section-title">方式</div>
            <div class="field">
              <label for="leftType">時間の決め方</label>
              <select id="leftType">
                <option value="relative">相対（〇日〇時間〇分後）</option>
                <option value="absolute">絶対（日時指定）</option>
              </select>
            </div>
          </div>

          <div id="leftRelativeSection" class="section">
            <div class="section-title">相対</div>
            <div class="row equal-3">
              <div class="field">
                <label for="leftDays">日</label>
                <input id="leftDays" type="number" min="0" max="365" value="0" />
              </div>
              <div class="field">
                <label for="leftHours">時間</label>
                <input id="leftHours" type="number" min="0" max="23" value="0" />
              </div>
              <div class="field">
                <label for="leftMinutes">分</label>
                <input id="leftMinutes" type="number" min="0" max="59" value="30" />
              </div>
            </div>
          </div>

          <div id="leftAbsoluteSection" class="section hidden">
            <div class="section-title">絶対</div>
            <div class="row equal-2">
              <div class="field">
                <label for="leftDate">日付</label>
                <input id="leftDate" type="date" />
              </div>
              <div class="field">
                <label for="leftTime">時刻</label>
                <input id="leftTime" type="time" step="60" />
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-title">色</div>
            <div class="field">
              <label for="leftColor">到達色</label>
              <input id="leftColor" type="color" value="#ff69b4" />
            </div>
          </div>

          <div id="leftHint" class="hint"></div>
        </div>

        <!-- RIGHT -->
        <div id="rightCard" class="setup-card">
          <h2 class="card-title">右</h2>

          <div class="section">
            <div class="section-title">方式</div>
            <div class="field">
              <label for="rightType">時間の決め方</label>
              <select id="rightType">
                <option value="absolute">絶対（日時指定）</option>
                <option value="relative">相対（〇日〇時間〇分後）</option>
              </select>
            </div>
          </div>

          <div id="rightRelativeSection" class="section hidden">
            <div class="section-title">相対</div>
            <div class="row equal-3">
              <div class="field">
                <label for="rightDays">日</label>
                <input id="rightDays" type="number" min="0" max="365" value="0" />
              </div>
              <div class="field">
                <label for="rightHours">時間</label>
                <input id="rightHours" type="number" min="0" max="23" value="0" />
              </div>
              <div class="field">
                <label for="rightMinutes">分</label>
                <input id="rightMinutes" type="number" min="0" max="59" value="30" />
              </div>
            </div>
          </div>

          <div id="rightAbsoluteSection" class="section">
            <div class="section-title">絶対</div>
            <div class="row equal-2">
              <div class="field">
                <label for="rightDate">日付</label>
                <input id="rightDate" type="date" />
              </div>
              <div class="field">
                <label for="rightTime">時刻</label>
                <input id="rightTime" type="time" step="60" />
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-title">色</div>
            <div class="field">
              <label for="rightColor">到達色</label>
              <input id="rightColor" type="color" value="#8debd7" />
            </div>
          </div>

          <div id="rightHint" class="hint"></div>
        </div>
      </div>

      <button id="startBtn" class="start-btn">スタート</button>
    </section>

    <!-- ================= TIMER ================= -->
    <section id="timerScreen" class="timer-screen">
      <div id="paneLeft" class="pane">
        <div class="base"></div>
        <div id="fillLeft" class="fill"></div>
        <div id="tapLeft" class="tap-layer">
          <div class="tap-pill">タップして再設定</div>
        </div>

        <div id="inlineLeft" class="inline-setup">
          <h3 class="inline-title">左を再設定</h3>
          <div class="small-note">右は止まらず進み続けます</div>

          <div class="section">
            <div class="section-title">方式</div>
            <div class="field">
              <label for="leftTypeInline">時間の決め方</label>
              <select id="leftTypeInline">
                <option value="relative">相対（〇日〇時間〇分後）</option>
                <option value="absolute">絶対（日時指定）</option>
              </select>
            </div>
          </div>

          <div id="leftRelativeInlineSection" class="section">
            <div class="section-title">相対</div>
            <div class="row equal-3">
              <div class="field">
                <label for="leftDaysInline">日</label>
                <input id="leftDaysInline" type="number" min="0" max="365" value="0" />
              </div>
              <div class="field">
                <label for="leftHoursInline">時間</label>
                <input id="leftHoursInline" type="number" min="0" max="23" value="0" />
              </div>
              <div class="field">
                <label for="leftMinutesInline">分</label>
                <input id="leftMinutesInline" type="number" min="0" max="59" value="30" />
              </div>
            </div>
          </div>

          <div id="leftAbsoluteInlineSection" class="section hidden">
            <div class="section-title">絶対</div>
            <div class="row equal-2">
              <div class="field">
                <label for="leftDateInline">日付</label>
                <input id="leftDateInline" type="date" />
              </div>
              <div class="field">
                <label for="leftTimeInline">時刻</label>
                <input id="leftTimeInline" type="time" step="60" />
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-title">色</div>
            <div class="field">
              <label for="leftColorInline">到達色</label>
              <input id="leftColorInline" type="color" value="#ff69b4" />
            </div>
          </div>

          <div id="leftInlineHint" class="hint"></div>
          <button id="restartLeftBtn" class="restart-btn">左だけ再スタート</button>
        </div>
      </div>

      <div id="paneRight" class="pane">
        <div class="base"></div>
        <div id="fillRight" class="fill"></div>
        <div id="tapRight" class="tap-layer">
          <div class="tap-pill">タップして再設定</div>
        </div>

        <div id="inlineRight" class="inline-setup">
          <h3 class="inline-title">右を再設定</h3>
          <div class="small-note">左は止まらず進み続けます</div>

          <div class="section">
            <div class="section-title">方式</div>
            <div class="field">
              <label for="rightTypeInline">時間の決め方</label>
              <select id="rightTypeInline">
                <option value="absolute">絶対（日時指定）</option>
                <option value="relative">相対（〇日〇時間〇分後）</option>
              </select>
            </div>
          </div>

          <div id="rightRelativeInlineSection" class="section hidden">
            <div class="section-title">相対</div>
            <div class="row equal-3">
              <div class="field">
                <label for="rightDaysInline">日</label>
                <input id="rightDaysInline" type="number" min="0" max="365" value="0" />
              </div>
              <div class="field">
                <label for="rightHoursInline">時間</label>
                <input id="rightHoursInline" type="number" min="0" max="23" value="0" />
              </div>
              <div class="field">
                <label for="rightMinutesInline">分</label>
                <input id="rightMinutesInline" type="number" min="0" max="59" value="30" />
              </div>
            </div>
          </div>

          <div id="rightAbsoluteInlineSection" class="section">
            <div class="section-title">絶対</div>
            <div class="row equal-2">
              <div class="field">
                <label for="rightDateInline">日付</label>
                <input id="rightDateInline" type="date" />
              </div>
              <div class="field">
                <label for="rightTimeInline">時刻</label>
                <input id="rightTimeInline" type="time" step="60" />
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-title">色</div>
            <div class="field">
              <label for="rightColorInline">到達色</label>
              <input id="rightColorInline" type="color" value="#8debd7" />
            </div>
          </div>

          <div id="rightInlineHint" class="hint"></div>
          <button id="restartRightBtn" class="restart-btn">右だけ再スタート</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    const els = {
      setupScreen: document.getElementById('setupScreen'),
      timerScreen: document.getElementById('timerScreen'),
      setupGrid: document.getElementById('setupGrid'),
      startBtn: document.getElementById('startBtn'),

      rightEnabled: document.getElementById('rightEnabled'),
      rightCard: document.getElementById('rightCard'),

      leftType: document.getElementById('leftType'),
      leftRelativeSection: document.getElementById('leftRelativeSection'),
      leftAbsoluteSection: document.getElementById('leftAbsoluteSection'),
      leftDays: document.getElementById('leftDays'),
      leftHours: document.getElementById('leftHours'),
      leftMinutes: document.getElementById('leftMinutes'),
      leftDate: document.getElementById('leftDate'),
      leftTime: document.getElementById('leftTime'),
      leftColor: document.getElementById('leftColor'),
      leftHint: document.getElementById('leftHint'),

      rightType: document.getElementById('rightType'),
      rightRelativeSection: document.getElementById('rightRelativeSection'),
      rightAbsoluteSection: document.getElementById('rightAbsoluteSection'),
      rightDays: document.getElementById('rightDays'),
      rightHours: document.getElementById('rightHours'),
      rightMinutes: document.getElementById('rightMinutes'),
      rightDate: document.getElementById('rightDate'),
      rightTime: document.getElementById('rightTime'),
      rightColor: document.getElementById('rightColor'),
      rightHint: document.getElementById('rightHint'),

      paneLeft: document.getElementById('paneLeft'),
      paneRight: document.getElementById('paneRight'),
      fillLeft: document.getElementById('fillLeft'),
      fillRight: document.getElementById('fillRight'),
      tapLeft: document.getElementById('tapLeft'),
      tapRight: document.getElementById('tapRight'),

      inlineLeft: document.getElementById('inlineLeft'),
      inlineRight: document.getElementById('inlineRight'),

      leftTypeInline: document.getElementById('leftTypeInline'),
      leftRelativeInlineSection: document.getElementById('leftRelativeInlineSection'),
      leftAbsoluteInlineSection: document.getElementById('leftAbsoluteInlineSection'),
      leftDaysInline: document.getElementById('leftDaysInline'),
      leftHoursInline: document.getElementById('leftHoursInline'),
      leftMinutesInline: document.getElementById('leftMinutesInline'),
      leftDateInline: document.getElementById('leftDateInline'),
      leftTimeInline: document.getElementById('leftTimeInline'),
      leftColorInline: document.getElementById('leftColorInline'),
      leftInlineHint: document.getElementById('leftInlineHint'),
      restartLeftBtn: document.getElementById('restartLeftBtn'),

      rightTypeInline: document.getElementById('rightTypeInline'),
      rightRelativeInlineSection: document.getElementById('rightRelativeInlineSection'),
      rightAbsoluteInlineSection: document.getElementById('rightAbsoluteInlineSection'),
      rightDaysInline: document.getElementById('rightDaysInline'),
      rightHoursInline: document.getElementById('rightHoursInline'),
      rightMinutesInline: document.getElementById('rightMinutesInline'),
      rightDateInline: document.getElementById('rightDateInline'),
      rightTimeInline: document.getElementById('rightTimeInline'),
      rightColorInline: document.getElementById('rightColorInline'),
      rightInlineHint: document.getElementById('rightInlineHint'),
      restartRightBtn: document.getElementById('restartRightBtn'),
    };

    const state = {
      rightEnabled: true,
      left: createModeState(),
      right: createModeState(),
      rafId: null
    };

    function createModeState() {
      return {
        running: false,
        finished: false,
        startMs: null,
        endMs: null,
        durationMs: null,
        color: '#ffffff'
      };
    }

    function nowMs() {
      return Date.now();
    }

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function setDefaultAbsolute(dateInput, timeInput) {
      const dt = new Date();
      dt.setSeconds(0, 0);
      const mins = dt.getMinutes();
      const add = (5 - (mins % 5)) % 5 || 5;
      dt.setMinutes(mins + add);

      dateInput.value = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
      timeInput.value = `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
    }

    function setVisibility(el, show) {
      el.classList.toggle('hidden', !show);
    }

    function syncTypeSections(prefix) {
      const type = els[`${prefix}Type`].value;
      setVisibility(els[`${prefix}RelativeSection`], type === 'relative');
      setVisibility(els[`${prefix}AbsoluteSection`], type === 'absolute');
    }

    function syncTypeSectionsInline(prefix) {
      const type = els[`${prefix}TypeInline`].value;
      setVisibility(els[`${prefix}RelativeInlineSection`], type === 'relative');
      setVisibility(els[`${prefix}AbsoluteInlineSection`], type === 'absolute');
    }

    function updateLayout() {
      state.rightEnabled = els.rightEnabled.checked;
      els.rightCard.classList.toggle('hidden', !state.rightEnabled);
      els.setupGrid.classList.toggle('single', !state.rightEnabled);

      els.timerScreen.classList.toggle('single', !state.rightEnabled);
      els.paneRight.classList.toggle('hidden', !state.rightEnabled);
    }

    function validateRelative(daysEl, hoursEl, minutesEl, hintEl) {
      const d = Number(daysEl.value || 0);
      const h = Number(hoursEl.value || 0);
      const m = Number(minutesEl.value || 0);

      if (d < 0 || h < 0 || m < 0) {
        hintEl.textContent = '0以上を入れてください';
        return null;
      }

      const durationMs = ((((d * 24) + h) * 60) + m) * 60 * 1000;
      if (durationMs <= 0) {
        hintEl.textContent = '1分以上にしてください';
        return null;
      }

      hintEl.textContent = '';
      return {
        startMs: nowMs(),
        endMs: nowMs() + durationMs,
        durationMs
      };
    }

    function validateAbsolute(dateEl, timeEl, hintEl) {
      if (!dateEl.value || !timeEl.value) {
        hintEl.textContent = '日付と時刻を入れてください';
        return null;
      }

      const target = new Date(`${dateEl.value}T${timeEl.value}:00`);
      const endMs = target.getTime();

      if (Number.isNaN(endMs)) {
        hintEl.textContent = '日時が不正です';
        return null;
      }

      const startMs = nowMs();
      const durationMs = endMs - startMs;

      if (durationMs <= 0) {
        hintEl.textContent = '未来の日時を入れてください';
        return null;
      }

      hintEl.textContent = '';
      return { startMs, endMs, durationMs };
    }

    function readConfig(prefix, inline = false) {
      const typeEl = els[inline ? `${prefix}TypeInline` : `${prefix}Type`];
      const colorEl = els[inline ? `${prefix}ColorInline` : `${prefix}Color`];
      const hintEl = els[inline ? `${prefix}InlineHint` : `${prefix}Hint`];

      const type = typeEl.value;
      let timing = null;

      if (type === 'relative') {
        timing = validateRelative(
          els[inline ? `${prefix}DaysInline` : `${prefix}Days`],
          els[inline ? `${prefix}HoursInline` : `${prefix}Hours`],
          els[inline ? `${prefix}MinutesInline` : `${prefix}Minutes`],
          hintEl
        );
      } else {
        timing = validateAbsolute(
          els[inline ? `${prefix}DateInline` : `${prefix}Date`],
          els[inline ? `${prefix}TimeInline` : `${prefix}Time`],
          hintEl
        );
      }

      if (!timing) return null;

      return {
        type,
        color: colorEl.value,
        ...timing
      };
    }

    function applyMode(modeState, fillEl, paneEl, tapEl, inlineEl, config) {
      modeState.running = true;
      modeState.finished = false;
      modeState.startMs = config.startMs;
      modeState.endMs = config.endMs;
      modeState.durationMs = config.durationMs;
      modeState.color = config.color;

      fillEl.style.background = config.color;
      paneEl.classList.remove('blink');
      tapEl.classList.remove('active');
      inlineEl.classList.remove('active');
    }

    function openTimer() {
      els.setupScreen.style.display = 'none';
      els.timerScreen.classList.add('active');
      updateLayout();
    }

    function progress(mode) {
      if (!mode.durationMs || !mode.startMs) return 0;
      return Math.max(0, Math.min(1, (nowMs() - mode.startMs) / mode.durationMs));
    }

    function finishMode(mode, paneEl, tapEl, fillEl) {
      mode.running = false;
      mode.finished = true;
      fillEl.style.height = '100%';
      paneEl.classList.add('blink');
      tapEl.classList.add('active');
    }

    function updateOne(mode, paneEl, tapEl, fillEl) {
      if (!mode.running && !mode.finished) {
        fillEl.style.height = '0%';
        return;
      }

      if (mode.running) {
        const remain = mode.endMs - nowMs();
        const p = progress(mode);
        fillEl.style.height = `${p * 100}%`;

        if (remain <= 0) {
          finishMode(mode, paneEl, tapEl, fillEl);
        }
        return;
      }

      if (mode.finished) {
        fillEl.style.height = '100%';
      }
    }

    function tick() {
      updateOne(state.left, els.paneLeft, els.tapLeft, els.fillLeft);

      if (state.rightEnabled) {
        updateOne(state.right, els.paneRight, els.tapRight, els.fillRight);
      }

      state.rafId = requestAnimationFrame(tick);
    }

    function copyMainToInline(prefix) {
      els[`${prefix}TypeInline`].value = els[`${prefix}Type`].value;
      els[`${prefix}ColorInline`].value = els[`${prefix}Color`].value;

      els[`${prefix}DaysInline`].value = els[`${prefix}Days`].value;
      els[`${prefix}HoursInline`].value = els[`${prefix}Hours`].value;
      els[`${prefix}MinutesInline`].value = els[`${prefix}Minutes`].value;

      els[`${prefix}DateInline`].value = els[`${prefix}Date`].value;
      els[`${prefix}TimeInline`].value = els[`${prefix}Time`].value;

      syncTypeSectionsInline(prefix);
    }

    function copyInlineToMain(prefix) {
      els[`${prefix}Type`].value = els[`${prefix}TypeInline`].value;
      els[`${prefix}Color`].value = els[`${prefix}ColorInline`].value;

      els[`${prefix}Days`].value = els[`${prefix}DaysInline`].value;
      els[`${prefix}Hours`].value = els[`${prefix}HoursInline`].value;
      els[`${prefix}Minutes`].value = els[`${prefix}MinutesInline`].value;

      els[`${prefix}Date`].value = els[`${prefix}DateInline`].value;
      els[`${prefix}Time`].value = els[`${prefix}TimeInline`].value;

      syncTypeSections(prefix);
    }

    function bindMirrors(prefix) {
      const pairs = [
        [`${prefix}Type`, `${prefix}TypeInline`],
        [`${prefix}Color`, `${prefix}ColorInline`],
        [`${prefix}Days`, `${prefix}DaysInline`],
        [`${prefix}Hours`, `${prefix}HoursInline`],
        [`${prefix}Minutes`, `${prefix}MinutesInline`],
        [`${prefix}Date`, `${prefix}DateInline`],
        [`${prefix}Time`, `${prefix}TimeInline`],
      ];

      pairs.forEach(([a, b]) => {
        els[a].addEventListener('input', () => { els[b].value = els[a].value; });
        els[b].addEventListener('input', () => { els[a].value = els[b].value; });
      });

      els[`${prefix}Type`].addEventListener('change', () => syncTypeSections(prefix));
      els[`${prefix}TypeInline`].addEventListener('change', () => syncTypeSectionsInline(prefix));
    }

    function init() {
      setDefaultAbsolute(els.leftDate, els.leftTime);
      setDefaultAbsolute(els.rightDate, els.rightTime);
      setDefaultAbsolute(els.leftDateInline, els.leftTimeInline);
      setDefaultAbsolute(els.rightDateInline, els.rightTimeInline);

      syncTypeSections('left');
      syncTypeSections('right');
      syncTypeSectionsInline('left');
      syncTypeSectionsInline('right');
      updateLayout();

      bindMirrors('left');
      bindMirrors('right');

      els.rightEnabled.addEventListener('change', updateLayout);

      els.startBtn.addEventListener('click', () => {
        const leftConfig = readConfig('left', false);
        if (!leftConfig) return;

        let rightConfig = null;
        if (state.rightEnabled) {
          rightConfig = readConfig('right', false);
          if (!rightConfig) return;
        }

        applyMode(state.left, els.fillLeft, els.paneLeft, els.tapLeft, els.inlineLeft, leftConfig);

        if (state.rightEnabled && rightConfig) {
          applyMode(state.right, els.fillRight, els.paneRight, els.tapRight, els.inlineRight, rightConfig);
        } else {
          state.right.running = false;
          state.right.finished = false;
          state.right.startMs = null;
          state.right.endMs = null;
          state.right.durationMs = null;
          els.fillRight.style.height = '0%';
          els.paneRight.classList.remove('blink');
          els.tapRight.classList.remove('active');
          els.inlineRight.classList.remove('active');
        }

        openTimer();
      });

      els.tapLeft.addEventListener('click', () => {
        if (!state.left.finished) return;
        copyMainToInline('left');
        els.tapLeft.classList.remove('active');
        els.paneLeft.classList.remove('blink');
        els.inlineLeft.classList.add('active');
      });

      els.tapRight.addEventListener('click', () => {
        if (!state.right.finished) return;
        copyMainToInline('right');
        els.tapRight.classList.remove('active');
        els.paneRight.classList.remove('blink');
        els.inlineRight.classList.add('active');
      });

      els.restartLeftBtn.addEventListener('click', () => {
        const config = readConfig('left', true);
        if (!config) return;
        copyInlineToMain('left');
        applyMode(state.left, els.fillLeft, els.paneLeft, els.tapLeft, els.inlineLeft, config);
      });

      els.restartRightBtn.addEventListener('click', () => {
        const config = readConfig('right', true);
        if (!config) return;
        copyInlineToMain('right');
        applyMode(state.right, els.fillRight, els.paneRight, els.tapRight, els.inlineRight, config);
      });

      tick();
    }

    init();
  </script>
</body>
</html>
