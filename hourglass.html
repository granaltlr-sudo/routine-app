<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <title>Silent Dual Alarm Hourglass</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #101010;
      --panel2: #181818;
      --text: #f3f3f3;
      --muted: #aaaaaa;
      --accent: #ff69b4;
      --border: rgba(255,255,255,0.12);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    body {
      touch-action: manipulation;
      user-select: none;
    }

    .app {
      width: 100vw;
      height: 100vh;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    /* ---------- setup screen ---------- */
    .setup-screen {
      position: absolute;
      inset: 0;
      padding:
        calc(16px + var(--safe-top))
        calc(14px + var(--safe-right))
        calc(16px + var(--safe-bottom))
        calc(14px + var(--safe-left));
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.06), transparent 32%),
        #000;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .setup-header {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.03em;
      margin-top: 4px;
    }

    .top-options {
      display: flex;
      justify-content: center;
      gap: 10px;
      align-items: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
    }

    .setup-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .setup-grid.single {
      grid-template-columns: 1fr;
    }

    .setup-card {
      background: linear-gradient(180deg, var(--panel2), var(--panel));
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    .setup-card h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .sub {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      margin-top: -4px;
    }

    .field-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .field-row.two {
      grid-template-columns: repeat(2, 1fr);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
    }

    input[type="number"],
    input[type="date"],
    input[type="time"] {
      width: 100%;
      background: #000;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 14px;
      height: 46px;
      font-size: 16px;
      padding: 0 12px;
      outline: none;
    }

    input[type="color"] {
      width: 100%;
      height: 46px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 14px;
      background: #000;
      padding: 4px;
    }

    .toggle-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.10);
      font-size: 14px;
    }

    .hint {
      font-size: 12px;
      color: #ffb3c7;
      min-height: 16px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    button {
      appearance: none;
      border: none;
      outline: none;
      border-radius: 16px;
      min-height: 48px;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      flex: 1;
      background: #fff;
      color: #000;
    }

    .btn-secondary {
      flex: 1;
      background: rgba(255,255,255,0.10);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .global-start {
      min-height: 54px;
      background: linear-gradient(180deg, #ffffff, #dfdfdf);
      color: #000;
      font-size: 16px;
      border-radius: 18px;
      font-weight: 800;
    }

    /* ---------- timer screen ---------- */
    .timer-screen {
      position: absolute;
      inset: 0;
      display: none;
      background: #000;
    }

    .timer-screen.active {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .timer-screen.single {
      grid-template-columns: 1fr;
    }

    .mode-pane {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #000;
      border-right: 1px solid rgba(255,255,255,0.08);
    }

    .mode-pane:last-child {
      border-right: none;
    }

    .pane-base {
      position: absolute;
      inset: 0;
      background: #000;
    }

    .pane-fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 0%;
      background: var(--accent);
      will-change: height;
    }

    .pane-ui {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding:
        calc(16px + var(--safe-top))
        12px
        calc(16px + var(--safe-bottom))
        12px;
      z-index: 2;
      pointer-events: none;
    }

    .pane-top {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    }

    .pane-title {
      font-size: 16px;
      font-weight: 700;
      opacity: 0.95;
    }

    .pane-status {
      font-size: 13px;
      opacity: 0.9;
    }

    .pane-time {
      text-align: center;
      font-size: clamp(28px, 6vw, 54px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.35);
      margin-bottom: 8vh;
    }

    .finished-blink .pane-fill {
      animation: blinkFill 1s steps(2, start) infinite;
    }

    @keyframes blinkFill {
      0%   { opacity: 1; }
      50%  { opacity: 0.25; }
      100% { opacity: 1; }
    }

    .tap-layer {
      position: absolute;
      inset: 0;
      z-index: 5;
      background: transparent;
      display: none;
    }

    .tap-layer.active {
      display: block;
    }

    .tap-message {
      position: absolute;
      left: 50%;
      bottom: calc(24px + var(--safe-bottom));
      transform: translateX(-50%);
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      backdrop-filter: blur(6px);
      white-space: nowrap;
    }

    .inline-setup {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: none;
      background: linear-gradient(180deg, #121212, #050505);
      padding:
        calc(16px + var(--safe-top))
        12px
        calc(16px + var(--safe-bottom))
        12px;
      overflow: auto;
    }

    .inline-setup.active {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .inline-setup h3 {
      margin: 0;
      text-align: center;
      font-size: 18px;
    }

    .small-note {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: -4px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- SETUP -->
    <section id="setupScreen" class="setup-screen">
      <div class="setup-header">無音デュアル砂時計</div>

      <div class="top-options">
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;">
          <input id="mode2Enabled" type="checkbox" checked />
          モード2を使う
        </label>
      </div>

      <div id="setupGrid" class="setup-grid">
        <!-- MODE 1 -->
        <div class="setup-card">
          <h2>モード1</h2>
          <div class="sub">相対時間（〇日〇時間〇分後）</div>

          <div class="field-row">
            <div class="field">
              <label for="m1Days">日</label>
              <input id="m1Days" type="number" min="0" max="365" value="0" />
            </div>
            <div class="field">
              <label for="m1Hours">時間</label>
              <input id="m1Hours" type="number" min="0" max="23" value="0" />
            </div>
            <div class="field">
              <label for="m1Minutes">分</label>
              <input id="m1Minutes" type="number" min="0" max="59" value="30" />
            </div>
          </div>

          <div class="field">
            <label for="m1Color">色</label>
            <input id="m1Color" type="color" value="#ff69b4" />
          </div>

          <div id="m1Hint" class="hint"></div>
        </div>

        <!-- MODE 2 -->
        <div id="mode2SetupCard" class="setup-card">
          <h2>モード2</h2>
          <div class="sub">絶対時刻（今日の特定時刻が初期値）</div>

          <div class="field-row two">
            <div class="field">
              <label for="m2Date">日付</label>
              <input id="m2Date" type="date" />
            </div>
            <div class="field">
              <label for="m2Time">時刻</label>
              <input id="m2Time" type="time" step="60" />
            </div>
          </div>

          <div class="field">
            <label for="m2Color">色</label>
            <input id="m2Color" type="color" value="#8debd7" />
          </div>

          <div id="m2Hint" class="hint"></div>
        </div>
      </div>

      <button id="startAllBtn" class="global-start">スタート</button>
    </section>

    <!-- TIMER -->
    <section id="timerScreen" class="timer-screen">
      <!-- LEFT / MODE 1 -->
      <div id="pane1" class="mode-pane">
        <div class="pane-base"></div>
        <div id="fill1" class="pane-fill"></div>
        <div class="pane-ui">
          <div class="pane-top">
            <div class="pane-title">モード1</div>
            <div id="status1" class="pane-status">待機中</div>
          </div>
          <div id="time1" class="pane-time">00:00</div>
        </div>
        <div id="tap1" class="tap-layer">
          <div class="tap-message">タップしてこのモードだけ再設定</div>
        </div>

        <!-- inline setup for mode1 -->
        <div id="inlineSetup1" class="inline-setup">
          <h3>モード1を再設定</h3>
          <div class="small-note">もう片方は止まらず進み続けます</div>

          <div class="field-row">
            <div class="field">
              <label for="m1DaysInline">日</label>
              <input id="m1DaysInline" type="number" min="0" max="365" value="0" />
            </div>
            <div class="field">
              <label for="m1HoursInline">時間</label>
              <input id="m1HoursInline" type="number" min="0" max="23" value="0" />
            </div>
            <div class="field">
              <label for="m1MinutesInline">分</label>
              <input id="m1MinutesInline" type="number" min="0" max="59" value="30" />
            </div>
          </div>

          <div class="field">
            <label for="m1ColorInline">色</label>
            <input id="m1ColorInline" type="color" value="#ff69b4" />
          </div>

          <div id="m1InlineHint" class="hint"></div>

          <div class="btn-row">
            <button id="m1RestartBtn" class="btn-primary">このモードだけ再スタート</button>
          </div>
        </div>
      </div>

      <!-- RIGHT / MODE 2 -->
      <div id="pane2" class="mode-pane">
        <div class="pane-base"></div>
        <div id="fill2" class="pane-fill"></div>
        <div class="pane-ui">
          <div class="pane-top">
            <div class="pane-title">モード2</div>
            <div id="status2" class="pane-status">待機中</div>
          </div>
          <div id="time2" class="pane-time">00:00</div>
        </div>
        <div id="tap2" class="tap-layer">
          <div class="tap-message">タップしてこのモードだけ再設定</div>
        </div>

        <!-- inline setup for mode2 -->
        <div id="inlineSetup2" class="inline-setup">
          <h3>モード2を再設定</h3>
          <div class="small-note">もう片方は止まらず進み続けます</div>

          <div class="field-row two">
            <div class="field">
              <label for="m2DateInline">日付</label>
              <input id="m2DateInline" type="date" />
            </div>
            <div class="field">
              <label for="m2TimeInline">時刻</label>
              <input id="m2TimeInline" type="time" step="60" />
            </div>
          </div>

          <div class="field">
            <label for="m2ColorInline">色</label>
            <input id="m2ColorInline" type="color" value="#8debd7" />
          </div>

          <div id="m2InlineHint" class="hint"></div>

          <div class="btn-row">
            <button id="m2RestartBtn" class="btn-primary">このモードだけ再スタート</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const els = {
      setupScreen: document.getElementById('setupScreen'),
      timerScreen: document.getElementById('timerScreen'),
      setupGrid: document.getElementById('setupGrid'),
      startAllBtn: document.getElementById('startAllBtn'),

      mode2Enabled: document.getElementById('mode2Enabled'),
      mode2SetupCard: document.getElementById('mode2SetupCard'),

      m1Days: document.getElementById('m1Days'),
      m1Hours: document.getElementById('m1Hours'),
      m1Minutes: document.getElementById('m1Minutes'),
      m1Color: document.getElementById('m1Color'),
      m1Hint: document.getElementById('m1Hint'),

      m2Date: document.getElementById('m2Date'),
      m2Time: document.getElementById('m2Time'),
      m2Color: document.getElementById('m2Color'),
      m2Hint: document.getElementById('m2Hint'),

      pane1: document.getElementById('pane1'),
      pane2: document.getElementById('pane2'),
      fill1: document.getElementById('fill1'),
      fill2: document.getElementById('fill2'),
      status1: document.getElementById('status1'),
      status2: document.getElementById('status2'),
      time1: document.getElementById('time1'),
      time2: document.getElementById('time2'),
      tap1: document.getElementById('tap1'),
      tap2: document.getElementById('tap2'),

      inlineSetup1: document.getElementById('inlineSetup1'),
      inlineSetup2: document.getElementById('inlineSetup2'),

      m1DaysInline: document.getElementById('m1DaysInline'),
      m1HoursInline: document.getElementById('m1HoursInline'),
      m1MinutesInline: document.getElementById('m1MinutesInline'),
      m1ColorInline: document.getElementById('m1ColorInline'),
      m1InlineHint: document.getElementById('m1InlineHint'),
      m1RestartBtn: document.getElementById('m1RestartBtn'),

      m2DateInline: document.getElementById('m2DateInline'),
      m2TimeInline: document.getElementById('m2TimeInline'),
      m2ColorInline: document.getElementById('m2ColorInline'),
      m2InlineHint: document.getElementById('m2InlineHint'),
      m2RestartBtn: document.getElementById('m2RestartBtn'),
    };

    const state = {
      mode2Enabled: true,
      view: 'setup', // setup | timer
      mode1: createModeState('mode1'),
      mode2: createModeState('mode2'),
      rafId: null
    };

    function createModeState(name) {
      return {
        name,
        enabled: true,
        running: false,
        finished: false,
        inInlineSetup: false,
        startMs: null,
        endMs: null,
        durationMs: null,
        color: '#ffffff'
      };
    }

    function now() {
      return Date.now();
    }

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function formatRemaining(ms) {
      const totalSec = Math.max(0, Math.ceil(ms / 1000));
      const d = Math.floor(totalSec / 86400);
      const h = Math.floor((totalSec % 86400) / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;

      if (d > 0) return `${d}d ${pad(h)}:${pad(m)}:${pad(s)}`;
      return `${pad(h)}:${pad(m)}:${pad(s)}`;
    }

    function setDefaultMode2DateTime(targetDateInput, targetTimeInput) {
      const dt = new Date();
      dt.setSeconds(0, 0);

      // 5分単位で切り上げ
      const mins = dt.getMinutes();
      const add = (5 - (mins % 5)) % 5 || 5;
      dt.setMinutes(mins + add);

      const yyyy = dt.getFullYear();
      const mm = pad(dt.getMonth() + 1);
      const dd = pad(dt.getDate());
      const hh = pad(dt.getHours());
      const mi = pad(dt.getMinutes());

      targetDateInput.value = `${yyyy}-${mm}-${dd}`;
      targetTimeInput.value = `${hh}:${mi}`;
    }

    function syncInlineFromMain() {
      els.m1DaysInline.value = els.m1Days.value;
      els.m1HoursInline.value = els.m1Hours.value;
      els.m1MinutesInline.value = els.m1Minutes.value;
      els.m1ColorInline.value = els.m1Color.value;

      els.m2DateInline.value = els.m2Date.value;
      els.m2TimeInline.value = els.m2Time.value;
      els.m2ColorInline.value = els.m2Color.value;
    }

    function syncMainFromInline1() {
      els.m1Days.value = els.m1DaysInline.value;
      els.m1Hours.value = els.m1HoursInline.value;
      els.m1Minutes.value = els.m1MinutesInline.value;
      els.m1Color.value = els.m1ColorInline.value;
    }

    function syncMainFromInline2() {
      els.m2Date.value = els.m2DateInline.value;
      els.m2Time.value = els.m2TimeInline.value;
      els.m2Color.value = els.m2ColorInline.value;
    }

    function validateMode1(daysEl, hoursEl, minutesEl, hintEl) {
      const d = Number(daysEl.value || 0);
      const h = Number(hoursEl.value || 0);
      const m = Number(minutesEl.value || 0);

      if (d < 0 || h < 0 || m < 0) {
        hintEl.textContent = '0以上を入れてください';
        return null;
      }

      const durationMs = (((d * 24) + h) * 60 + m) * 60 * 1000;
      if (durationMs <= 0) {
        hintEl.textContent = '1分以上にしてください';
        return null;
      }

      hintEl.textContent = '';
      return durationMs;
    }

    function validateMode2(dateEl, timeEl, hintEl) {
      const dateStr = dateEl.value;
      const timeStr = timeEl.value;

      if (!dateStr || !timeStr) {
        hintEl.textContent = '日付と時刻を入れてください';
        return null;
      }

      const target = new Date(`${dateStr}T${timeStr}:00`);
      const targetMs = target.getTime();

      if (Number.isNaN(targetMs)) {
        hintEl.textContent = '日時の形式が不正です';
        return null;
      }

      if (targetMs <= now()) {
        hintEl.textContent = '現在より未来の時刻を入れてください';
        return null;
      }

      hintEl.textContent = '';
      return targetMs;
    }

    function startMode1FromMain() {
      const durationMs = validateMode1(els.m1Days, els.m1Hours, els.m1Minutes, els.m1Hint);
      if (!durationMs) return false;

      const startMs = now();
      state.mode1.running = true;
      state.mode1.finished = false;
      state.mode1.inInlineSetup = false;
      state.mode1.startMs = startMs;
      state.mode1.endMs = startMs + durationMs;
      state.mode1.durationMs = durationMs;
      state.mode1.color = els.m1Color.value;

      els.fill1.style.background = state.mode1.color;
      els.pane1.classList.remove('finished-blink');
      els.tap1.classList.remove('active');
      els.inlineSetup1.classList.remove('active');
      return true;
    }

    function startMode2FromMain() {
      const targetMs = validateMode2(els.m2Date, els.m2Time, els.m2Hint);
      if (!targetMs) return false;

      const startMs = now();
      state.mode2.running = true;
      state.mode2.finished = false;
      state.mode2.inInlineSetup = false;
      state.mode2.startMs = startMs;
      state.mode2.endMs = targetMs;
      state.mode2.durationMs = targetMs - startMs;
      state.mode2.color = els.m2Color.value;

      els.fill2.style.background = state.mode2.color;
      els.pane2.classList.remove('finished-blink');
      els.tap2.classList.remove('active');
      els.inlineSetup2.classList.remove('active');
      return true;
    }

    function restartMode1Inline() {
      const durationMs = validateMode1(
        els.m1DaysInline,
        els.m1HoursInline,
        els.m1MinutesInline,
        els.m1InlineHint
      );
      if (!durationMs) return false;

      syncMainFromInline1();

      const startMs = now();
      state.mode1.running = true;
      state.mode1.finished = false;
      state.mode1.inInlineSetup = false;
      state.mode1.startMs = startMs;
      state.mode1.endMs = startMs + durationMs;
      state.mode1.durationMs = durationMs;
      state.mode1.color = els.m1ColorInline.value;

      els.fill1.style.background = state.mode1.color;
      els.pane1.classList.remove('finished-blink');
      els.tap1.classList.remove('active');
      els.inlineSetup1.classList.remove('active');
      return true;
    }

    function restartMode2Inline() {
      const targetMs = validateMode2(
        els.m2DateInline,
        els.m2TimeInline,
        els.m2InlineHint
      );
      if (!targetMs) return false;

      syncMainFromInline2();

      const startMs = now();
      state.mode2.running = true;
      state.mode2.finished = false;
      state.mode2.inInlineSetup = false;
      state.mode2.startMs = startMs;
      state.mode2.endMs = targetMs;
      state.mode2.durationMs = targetMs - startMs;
      state.mode2.color = els.m2ColorInline.value;

      els.fill2.style.background = state.mode2.color;
      els.pane2.classList.remove('finished-blink');
      els.tap2.classList.remove('active');
      els.inlineSetup2.classList.remove('active');
      return true;
    }

    function showTimerScreen() {
      state.view = 'timer';
      els.setupScreen.style.display = 'none';
      els.timerScreen.classList.add('active');

      if (state.mode2Enabled) {
        els.timerScreen.classList.remove('single');
        els.pane2.classList.remove('hidden');
      } else {
        els.timerScreen.classList.add('single');
        els.pane2.classList.add('hidden');
      }
    }

    function showSetupScreen() {
      state.view = 'setup';
      els.setupScreen.style.display = 'flex';
      els.timerScreen.classList.remove('active');
    }

    function updateSetupLayout() {
      state.mode2Enabled = els.mode2Enabled.checked;

      if (state.mode2Enabled) {
        els.mode2SetupCard.classList.remove('hidden');
        els.setupGrid.classList.remove('single');
      } else {
        els.mode2SetupCard.classList.add('hidden');
        els.setupGrid.classList.add('single');
      }
    }

    function finishMode(mode, paneEl, tapEl, statusEl) {
      mode.running = false;
      mode.finished = true;
      paneEl.classList.add('finished-blink');
      tapEl.classList.add('active');
      statusEl.textContent = '完了';
    }

    function progressOf(mode) {
      if (!mode.startMs || !mode.endMs || !mode.durationMs || mode.durationMs <= 0) return 0;
      const p = (now() - mode.startMs) / mode.durationMs;
      return Math.max(0, Math.min(1, p));
    }

    function updatePane(mode, fillEl, timeEl, statusEl, paneEl, tapEl, label) {
      if (!mode.running && !mode.finished) {
        fillEl.style.height = '0%';
        statusEl.textContent = '待機中';
        timeEl.textContent = '--:--';
        return;
      }

      if (mode.running) {
        const remain = mode.endMs - now();
        const p = progressOf(mode);
        fillEl.style.height = `${p * 100}%`;

        statusEl.textContent = label;
        timeEl.textContent = formatRemaining(remain);

        if (remain <= 0) {
          fillEl.style.height = '100%';
          timeEl.textContent = '00:00:00';
          finishMode(mode, paneEl, tapEl, statusEl);
        }
        return;
      }

      if (mode.finished) {
        fillEl.style.height = '100%';
        timeEl.textContent = '00:00:00';
        statusEl.textContent = '完了';
      }
    }

    function tick() {
      updatePane(
        state.mode1,
        els.fill1,
        els.time1,
        els.status1,
        els.pane1,
        els.tap1,
        '進行中'
      );

      if (state.mode2Enabled) {
        updatePane(
          state.mode2,
          els.fill2,
          els.time2,
          els.status2,
          els.pane2,
          els.tap2,
          '進行中'
        );
      }

      state.rafId = requestAnimationFrame(tick);
    }

    function startLoop() {
      if (state.rafId) cancelAnimationFrame(state.rafId);
      tick();
    }

    function init() {
      setDefaultMode2DateTime(els.m2Date, els.m2Time);
      syncInlineFromMain();
      updateSetupLayout();
      showSetupScreen();
      startLoop();
    }

    /* ---------- events ---------- */
    els.mode2Enabled.addEventListener('change', updateSetupLayout);

    els.startAllBtn.addEventListener('click', () => {
      const ok1 = startMode1FromMain();
      if (!ok1) return;

      let ok2 = true;
      if (els.mode2Enabled.checked) {
        ok2 = startMode2FromMain();
      } else {
        state.mode2.running = false;
        state.mode2.finished = false;
        state.mode2.inInlineSetup = false;
      }

      if (!ok2) return;

      syncInlineFromMain();
      showTimerScreen();
    });

    els.tap1.addEventListener('click', () => {
      if (!state.mode1.finished) return;
      syncInlineFromMain();
      state.mode1.inInlineSetup = true;
      els.inlineSetup1.classList.add('active');
      els.tap1.classList.remove('active');
      els.pane1.classList.remove('finished-blink');
    });

    els.tap2.addEventListener('click', () => {
      if (!state.mode2.finished) return;
      syncInlineFromMain();
      state.mode2.inInlineSetup = true;
      els.inlineSetup2.classList.add('active');
      els.tap2.classList.remove('active');
      els.pane2.classList.remove('finished-blink');
    });

    els.m1RestartBtn.addEventListener('click', () => {
      restartMode1Inline();
    });

    els.m2RestartBtn.addEventListener('click', () => {
      restartMode2Inline();
    });

    // メイン入力とインライン入力を相互反映
    [
      ['m1Days', 'm1DaysInline'],
      ['m1Hours', 'm1HoursInline'],
      ['m1Minutes', 'm1MinutesInline'],
      ['m1Color', 'm1ColorInline'],
      ['m2Date', 'm2DateInline'],
      ['m2Time', 'm2TimeInline'],
      ['m2Color', 'm2ColorInline']
    ].forEach(([a, b]) => {
      els[a].addEventListener('input', () => { els[b].value = els[a].value; });
      els[b].addEventListener('input', () => { els[a].value = els[b].value; });
    });

    init();
  </script>
</body>
</html>
