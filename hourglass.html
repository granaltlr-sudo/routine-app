<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>砂時計タイマー</title>
  <style>
    :root {
      --pink: #ff6fb5;
      --bg: #000000;
      --text: #ffffff;
      --panel-border: #2b2b2b;
      --muted: #bdbdbd;
      --button: #1b1b1b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
    }

    .screen.active {
      display: block;
    }

    .setup {
      background: linear-gradient(180deg, #0b0b0b 0%, #000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: min(100%, 420px);
      background: rgba(17, 17, 17, 0.96);
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      text-align: center;
    }

    .sub {
      margin: 0 0 24px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .label {
      font-size: 14px;
      margin-bottom: 10px;
      color: #f2f2f2;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .preset {
      border: 1px solid #3a3a3a;
      background: var(--button);
      color: #fff;
      border-radius: 16px;
      padding: 16px 8px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .preset.selected {
      background: rgba(255, 111, 181, 0.18);
      border-color: var(--pink);
      color: #ffd4e7;
    }

    .custom-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 20px;
    }

    .custom-row input {
      width: 100%;
      min-width: 0;
      background: #0c0c0c;
      color: #fff;
      border: 1px solid #3a3a3a;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 18px;
      outline: none;
    }

    .custom-row span {
      color: var(--muted);
      font-size: 16px;
      flex: 0 0 auto;
    }

    .start-btn {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 18px 20px;
      font-size: 20px;
      font-weight: 800;
      background: var(--pink);
      color: #fff;
      cursor: pointer;
    }

    .hint {
      text-align: center;
      color: #8f8f8f;
      font-size: 12px;
      margin-top: 14px;
      line-height: 1.5;
    }

    .timer {
      background: #000;
      overflow: hidden;
      user-select: none;
    }

    .fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 0%;
      background: var(--pink);
    }

    .timer.done .fill {
      height: 100% !important;
      animation: flash 1s step-end infinite;
    }

    .timer-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: max(22px, env(safe-area-inset-top));
      pointer-events: none;
    }

    .time-label {
      font-size: 18px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.78);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    }

    .done-note {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(40px, calc(env(safe-area-inset-bottom) + 22px));
      text-align: center;
      color: rgba(255, 255, 255, 0.92);
      font-size: 20px;
      font-weight: 800;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .timer.done .done-note {
      opacity: 1;
    }

    @keyframes flash {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.38; }
    }
  </style>
</head>
<body>
  <section id="setupScreen" class="screen setup active">
    <div class="card">
      <h1>砂時計タイマー</h1>
      <p class="sub">時間を選んでスタート。下から少しずつピンクが上がります。</p>

      <div class="label">時間を選ぶ</div>
      <div class="preset-grid">
        <button class="preset selected" data-minutes="1">1分</button>
        <button class="preset" data-minutes="3">3分</button>
        <button class="preset" data-minutes="5">5分</button>
        <button class="preset" data-minutes="10">10分</button>
        <button class="preset" data-minutes="15">15分</button>
        <button class="preset" data-minutes="30">30分</button>
      </div>

      <div class="label">または自由入力</div>
      <div class="custom-row">
        <input id="customMinutes" type="number" inputmode="numeric" min="1" max="999" placeholder="分数を入力">
        <span>分</span>
      </div>

      <button id="startBtn" class="start-btn">スタート</button>
      <div class="hint">時間切れ後、画面のどこでもタップすると最初に戻ります。</div>
    </div>
  </section>

  <section id="timerScreen" class="screen timer">
    <div id="fill" class="fill"></div>
    <div class="timer-overlay">
      <div id="timeLabel" class="time-label"></div>
    </div>
    <div class="done-note">時間です<br>タップで戻る</div>
  </section>

  <script>
    const setupScreen = document.getElementById('setupScreen');
    const timerScreen = document.getElementById('timerScreen');
    const fill = document.getElementById('fill');
    const timeLabel = document.getElementById('timeLabel');
    const startBtn = document.getElementById('startBtn');
    const customMinutes = document.getElementById('customMinutes');
    const presetButtons = Array.from(document.querySelectorAll('.preset'));

    let selectedMinutes = 1;
    let totalMs = 60000;
    let startTime = null;
    let rafId = null;
    let finished = false;

    function selectPreset(minutes) {
      selectedMinutes = minutes;
      presetButtons.forEach((btn) => {
        btn.classList.toggle('selected', Number(btn.dataset.minutes) === minutes);
      });
    }

    presetButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        customMinutes.value = '';
        selectPreset(Number(btn.dataset.minutes));
      });
    });

    function getMinutes() {
      const custom = Number(customMinutes.value);
      if (Number.isFinite(custom) && custom >= 1) {
        return Math.floor(custom);
      }
      return selectedMinutes;
    }

    function showSetup() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      finished = false;
      startTime = null;
      fill.style.height = '0%';
      timerScreen.classList.remove('done');
      timerScreen.classList.remove('active');
      setupScreen.classList.add('active');
      timeLabel.textContent = '';
    }

    function finishTimer() {
      finished = true;
      fill.style.height = '100%';
      timeLabel.textContent = '0:00';
      timerScreen.classList.add('done');
    }

    function tick(now) {
      if (!startTime) startTime = now;

      const elapsed = now - startTime;
      const progress = Math.min(elapsed / totalMs, 1);
      fill.style.height = `${progress * 100}%`;

      const remainingMs = Math.max(totalMs - elapsed, 0);
      const totalSeconds = Math.ceil(remainingMs / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      timeLabel.textContent = `${minutes}:${String(seconds).padStart(2, '0')}`;

      if (progress >= 1) {
        finishTimer();
        return;
      }

      rafId = requestAnimationFrame(tick);
    }

    startBtn.addEventListener('click', () => {
      const minutes = getMinutes();
      totalMs = minutes * 60 * 1000;

      fill.style.height = '0%';
      setupScreen.classList.remove('active');
      timerScreen.classList.add('active');
      timerScreen.classList.remove('done');

      finished = false;
      startTime = null;

      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(tick);
    });

    timerScreen.addEventListener('click', () => {
      if (finished) {
        showSetup();
      }
    });

    showSetup();
  </script>
</body>
</html>
