<!DOCTYPE html>
        <div>
          <label>ルーチン名</label>
          <input id="titleInput" type="text" />
        </div>
        <div>
          <label>タスク一覧（1行に1個）</label>
          <textarea id="tasksInput"></textarea>
        </div>
      </div>
      <div class="btns">
        <button id="buildBtn">JSONを作る</button>
        <button id="copyBtn" class="secondary">JSONをコピー</button>
        <a id="runLink" class="linkbtn secondary" href="#">このルーチンを実行</a>
      </div>
    </div>

    <div class="card">
      <label>できあがったJSON</label>
      <textarea id="jsonOutput"></textarea>
      <div class="note">これを GitHub の <span id="fileName"></span> に丸ごと貼り付けてコミットすれば更新完了です。</div>
    </div>

    <div class="card">
      <pre>
GitHubでの更新手順
1. リポジトリを開く
2. routines フォルダを開く
3. morning.json など該当ファイルを開く
4. 鉛筆アイコン(Edit)を押す
5. 中身を全部消して、この画面のJSONを貼る
6. Commit changes を押す
      </pre>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const routineName = params.get('routine') || 'morning';

    const titleInput = document.getElementById('titleInput');
    const tasksInput = document.getElementById('tasksInput');
    const jsonOutput = document.getElementById('jsonOutput');
    const buildBtn = document.getElementById('buildBtn');
    const copyBtn = document.getElementById('copyBtn');
    const runLink = document.getElementById('runLink');
    const fileName = document.getElementById('fileName');

    fileName.textContent = `routines/${routineName}.json`;
    runLink.href = `run.html?routine=${encodeURIComponent(routineName)}`;

    function buildJson() {
      const title = titleInput.value.trim() || routineName;
      const tasks = tasksInput.value
        .split(/\n/)
        .map(v => v.trim())
        .filter(Boolean);

      const output = {
        title,
        tasks
      };

      jsonOutput.value = JSON.stringify(output, null, 2);
    }

    buildBtn.addEventListener('click', buildJson);

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(jsonOutput.value);
        copyBtn.textContent = 'コピーしました';
        setTimeout(() => {
          copyBtn.textContent = 'JSONをコピー';
        }, 1200);
      } catch {
        copyBtn.textContent = 'コピー失敗';
      }
    });

    async function init() {
      try {
        const response = await fetch(`routines/${routineName}.json?ts=${Date.now()}`);
        if (!response.ok) throw new Error('not found');
        const data = await response.json();
        titleInput.value = data.title || routineName;
        tasksInput.value = Array.isArray(data.tasks) ? data.tasks.join('\n') : '';
        buildJson();
      } catch {
        titleInput.value = routineName;
        tasksInput.value = '';
        buildJson();
      }
    }

    init();
  </script>
</body>
</html>
